<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SEASON RECORD SCORER</title>
    <link rel="icon" type="image/x-icon" href="SS.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body id="season-page">

    <header class="top-header">
        <a href="index.html" class="logo-link">
            <img src="SimScorer_Logo.png" alt="Sim Scorer Logo" class="header-logo">
        </a>
    </header>

    <nav class="side-nav">
        <button type="button" class="nav-trigger" aria-label="Toggle Menu" aria-expanded="false">
            <span>☰</span>
        </button>
        <div class="nav-content">
            <ul class="list-unstyled side-icon-list">
                <li>
                    <a href="season_record.html" class="side-nav-link">
                        <i class="fa-solid fa-calculator"></i>
                        <span class="nav-label" data-collapsed="Calculator" data-expanded="Season Calculator">Calculator</span>
                    </a>
                </li>
                <li>
                    <a href="miss_congeniality_picker.html" class="side-nav-link">
                        <i class="fa-regular fa-heart"></i>
                        <span class="nav-label" data-collapsed="Congeniality" data-expanded="Mx Congeniality">Congeniality</span>
                    </a>
                </li>
                <li>
                    <a href="lalaparuza_simulator.html" class="side-nav-link">
                        <i class="fa-solid fa-hourglass-half"></i>
                        <span class="nav-label" data-collapsed="Lala Sim" data-expanded="Lalaparuza Simulator">Lala Sim</span>
                    </a>
                </li>
                <li>
                    <a href="animated.html" class="side-nav-link">
                        <i class="fa-solid fa-crown"></i>
                        <span class="nav-label" data-collapsed="Hall of Fame" data-expanded="Hall of Fame">Hall of Fame</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

<div class="main-content">
    <div class="dashboard-wrapper d-flex align-items-center justify-content-center">
        
        <div class="dashboard-container mx-auto p-5 bg-white rounded-5 shadow-sm">
            
            <div class="home-hero mb-4 text-center">
                <h1 id="season-header">SEASON RECORD CALCULATOR</h1>
                <p class="subtitle text-uppercase">Paste the entire season record below. One person per line</p>
            </div>

                <div class="season-layout-container">
                    <textarea id="seasonInput" placeholder="WIN HIGH SAFE...&#10;SAFE LOW BTM..."></textarea>

                    <div class="row g-3 mt-3 align-items-stretch season-action-row">
                        <div class="col-md-3 d-flex">
                            <button type="button" id="processModern" class="red-btn season-main-btn">
                                MODERN
                            </button>
                        </div>
                        <div class="col-md-3 d-flex">
                            <button type="button" id="processLegacy" class="red-btn season-main-btn">
                                LEGACY
                            </button>
                        </div>
                        <div class="col-md-3 d-flex">
                            <button type="button" id="processHS" class="red-btn season-main-btn">
                                HIGH STAKES
                            </button>
                        </div>
                        <div class="col-md-3 d-flex">
                            <div class="stacked-btn-group">
                                <button type="button" id="copyResult" class="red-btn stacked-btn stacked-copy-btn">
                                    COPY
                                </button>
                                <button type="button" id="clearBtn" class="gray-btn stacked-btn stacked-clear-btn">
                                    CLEAR
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            <div id="results" class="mt-4" aria-live="polite"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
